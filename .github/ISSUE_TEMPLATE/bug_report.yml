name: Bug report
description: Report a problem with the demo, API, docs, or your deployment.
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, follow SECURITY.md. Do not include credentials or private images."
  - type: dropdown
    id: area
    attributes:
      label: Where did it happen?
      options:
        - Hosted demo or API
        - Self-hosted API
        - Local development
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal request or steps, with sensitive information removed.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include the error code or request ID if available.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, commit, and relevant Node.js, pnpm, or Wrangler versions.
